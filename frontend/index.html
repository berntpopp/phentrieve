<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Resource hints for performance optimization -->
    <link rel="dns-prefetch" href="https://api.phentrieve.kidney-genetics.org">

    <!-- Favicon setup for multiple platforms -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96">
    <!-- iOS/Safari specific icons -->
    <link rel="apple-touch-icon" href="/favicon-96x96.png">
    <link rel="mask-icon" href="/favicon.svg" color="#1867C0">
    <meta name="theme-color" content="#1867C0">

    <!-- Font display:swap is used in CSS to ensure text remains visible during font loading -->
    <title>Phentrieve: AI-Powered Research Phenotype Text to HPO Term Mapping</title>
    <meta name="description" content="Phentrieve is an AI-powered research tool that maps phenotype text to Human Phenotype Ontology (HPO) terms for research annotation and knowledge discovery. Not a diagnostic tool.">
    <link rel="canonical" href="https://phentrieve.kidney-genetics.org/">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Phentrieve",
      "url": "https://phentrieve.kidney-genetics.org/",
      "description": "AI-powered research tool that maps phenotype text to Human Phenotype Ontology (HPO) terms for research annotation and knowledge discovery. For research use only; not a diagnostic tool.",
      "applicationCategory": "ResearchApplication",
      "softwareVersion": "0.15.0",
      "keywords": "HPO, Human Phenotype Ontology, phenotype text mapping, phenotype annotation, research, bioinformatics",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Kidney Genetics Research Group",
        "url": "https://kidney-genetics.org/"
      }
    }
    </script>
    <!-- No modulepreload to avoid MIME type errors -->
    <!-- Paint the app background before JS mounts (avoids a white flash) -->
    <style>html, body { background: #f5f5f5; } @media (prefers-color-scheme: dark) { html:not(.theme-light), html:not(.theme-light) body { background: #121212; } } html.theme-dark, html.theme-dark body { background: #121212; }</style>
    <!-- Apply an explicit saved theme before first paint (key matches ThemeToggle) -->
    <script>try { var t = localStorage.getItem('phentrieve-theme'); if (t === 'light' || t === 'dark') document.documentElement.classList.add('theme-' + t); } catch (e) {}</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
