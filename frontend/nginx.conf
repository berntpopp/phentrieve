limit_req_zone $binary_remote_addr zone=text_process_limit:10m rate=6r/m;
# Auth endpoints send email (register, resend-verification, password reset) or
# check passwords (login); throttle per client IP.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# SPA policy is strict 'self' (the production bundle needs no eval). /api/ serves
# the OpenAPI docs (Swagger UI / ReDoc) which load assets from cdn.jsdelivr.net.
map $uri $csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';";
    ~^/api/ "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https:; frame-ancestors 'self';";
}

# realip rewrites $remote_addr to the real client, but the API resolves the
# client itself from X-Forwarded-For + the immediate peer
# (PHENTRIEVE_TRUSTED_PROXY_CIDRS), so forward the chain exactly as before:
# incoming XFF plus the original peer address (not the rewritten $remote_addr).
map $http_x_forwarded_for $upstream_x_forwarded_for {
    default "$http_x_forwarded_for, $realip_remote_addr";
    ''      $realip_remote_addr;
}

# Honor the X-Forwarded-Proto sent by the upstream reverse proxy (NPM terminates
# TLS and forwards https); fall back to $scheme for direct/dev access. Without
# this, setting X-Forwarded-Proto to $scheme here (always http on :8080) would
# overwrite the real https, making the API emit http:// redirects (e.g.
# /api/v1/health and /mcp 307 -> http://...), which break behind HTTPS.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Behind Nginx Proxy Manager every request arrives from a docker-network
    # address; take the client IP from X-Forwarded-For so limit_req keys per
    # client instead of one shared bucket.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compression (gzip is built-in to nginx-unprivileged)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Proxy API requests to the backend service
    location = /api/v1/text/process {
        limit_req zone=text_process_limit burst=10 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://phentrieve_api:8000/api/v1/text/process;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $upstream_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Upstream (uvicorn) is reached over plain http and does its own client-IP
        # resolution for quota (PHENTRIEVE_TRUSTED_PROXY_CIDRS), so we must NOT
        # enable uvicorn's proxy-header client rewriting. That leaves redirects
        # with an http:// Location; rewrite the scheme back to https here.
        proxy_redirect http:// https://;

        # Increase timeouts for long-running inference tasks
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Credential-checking / email-sending auth endpoints: same proxying as /api/,
    # plus a per-client rate limit. /me, /refresh, /logout fall through to /api/
    # unlimited (many clinicians can share one hospital NAT IP). Optional trailing
    # slash so FastAPI's /login/ -> /login redirect cannot dodge the limit.
    location ~ ^/api/v1/auth/(login|register|resend-verification|verify|password-reset/request|password-reset/confirm)/?$ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        # No URI part: regex locations must pass the original request URI.
        proxy_pass http://phentrieve_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $upstream_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect http:// https://;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://phentrieve_api:8000/api/;
        # Docs CSP for /api/ comes from the $csp map; security headers inherit.

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $upstream_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Upstream (uvicorn) is reached over plain http and does its own client-IP
        # resolution for quota (PHENTRIEVE_TRUSTED_PROXY_CIDRS), so we must NOT
        # enable uvicorn's proxy-header client rewriting. That leaves redirects
        # with an http:// Location; rewrite the scheme back to https here.
        proxy_redirect http:// https://;

        # Increase timeouts for long-running inference tasks
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy MCP (Model Context Protocol) requests to the backend service
    # MCP uses SSE (Server-Sent Events) for Streamable HTTP transport
    location /mcp {
        proxy_pass http://phentrieve_api:8000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $upstream_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Upstream (uvicorn) is reached over plain http and does its own client-IP
        # resolution for quota (PHENTRIEVE_TRUSTED_PROXY_CIDRS), so we must NOT
        # enable uvicorn's proxy-header client rewriting. That leaves redirects
        # with an http:// Location; rewrite the scheme back to https here.
        proxy_redirect http:// https://;

        # Required for SSE (Server-Sent Events) used by MCP Streamable HTTP
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Increase timeouts for long-running MCP sessions
        proxy_read_timeout 3600s;  # 1 hour for SSE connections
        proxy_connect_timeout 75s;
    }

    # SPA routing - try files first, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Disable caching for index.html (SPA entry point)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Health check endpoint (for Docker health checks and load balancers)
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Deny access to hidden files (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /\.(git|svn|hg)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
