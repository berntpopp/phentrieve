# Security headers (OWASP). Included at server level AND in every location that
# sets its own add_header, because nginx drops inherited add_header directives
# in any block that declares one. $csp is chosen per-URI in nginx.conf.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $csp always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
