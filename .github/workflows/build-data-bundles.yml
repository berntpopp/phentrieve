name: Build Verified HPO Data Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Data-release tag owned by the caller repository.
        required: true
        type: string
      release_spec_path:
        description: Path to the immutable release JSON in the caller repository.
        required: true
        type: string
      source_commit:
        description: Immutable Phentrieve source commit used to build the indexes.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Data-release tag.
        required: true
        type: string
      release_spec_path:
        description: Path to the immutable release JSON in the caller repository.
        required: true
        type: string
      source_commit:
        description: Immutable Phentrieve source commit used to build the indexes.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hpo-data-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-draft:
    name: Build and Draft ${{ inputs.release_tag }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    permissions:
      contents: write
    # Inputs reach shell steps through env, never template expansion (script injection).
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SPEC_PATH: ${{ inputs.release_spec_path }}
    steps:
      - name: Checkout data-release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: data-release
          persist-credentials: false

      - name: Checkout pinned Phentrieve source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: berntpopp/phentrieve
          ref: ${{ inputs.source_commit }}
          path: phentrieve
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: phentrieve/uv.lock

      - name: Install pinned dependencies
        working-directory: phentrieve
        run: uv sync --frozen --all-extras --dev

      - name: Build serial CUDA matrix
        working-directory: phentrieve
        run: |
          uv run python scripts/build_data_release.py \
            --spec "${GITHUB_WORKSPACE}/data-release/${RELEASE_SPEC_PATH}" \
            --data-dir ".runs/${RELEASE_TAG}/data" \
            --output-dir "dist/${RELEASE_TAG}" \
            --device cuda

      - name: Run retrieval smoke checks
        working-directory: phentrieve
        run: |
          uv run python scripts/verify_data_release.py \
            --spec "${GITHUB_WORKSPACE}/data-release/${RELEASE_SPEC_PATH}" \
            --bundle-dir "dist/${RELEASE_TAG}" \
            --smoke-test

      - name: Create caller-owned draft release
        working-directory: phentrieve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "HPO ${RELEASE_TAG}" \
            --notes "Verified HPO vector-index data release. See release-manifest.json and verification-report.json." \
            "dist/${RELEASE_TAG}"/*.tar.gz \
            "dist/${RELEASE_TAG}/SHA256SUMS" \
            "dist/${RELEASE_TAG}/release-manifest.json" \
            "dist/${RELEASE_TAG}/verification-report.json"
