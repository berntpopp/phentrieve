name: CI - Continuous Integration

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'plan/**'
      - 'LICENSE'
      - '.github/workflows/deploy-docs.yml'
  # Draft PRs run nothing; marking the PR ready (ready_for_review) runs the full gate,
  # and drafts cannot merge, so no unverified head can land.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'plan/**'
      - 'LICENSE'
      - '.github/workflows/deploy-docs.yml'
  # Weekly + manual runs test every supported Python; PRs and pushes test the 3.11 floor.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes are cancelled; main/develop runs always finish so caches get saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.11.28'
  NODE_VERSION: '24'

jobs:
  changes:
    name: Detect Changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.full.outputs.run == 'true' || steps.filter.outputs.python == 'true' }}
      frontend: ${{ steps.full.outputs.run == 'true' || steps.filter.outputs.frontend == 'true' }}
      python-versions: ${{ steps.full.outputs.run == 'true' && '["3.11", "3.12", "3.13"]' || '["3.11"]' }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: full
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            schedule|workflow_dispatch) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Image filters list every build input: the API image installs from uv.lock,
          # so a dependency bump must rebuild and rescan it.
          filters: |
            python:
              - 'phentrieve/**'
              - 'api/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            api-image:
              - 'api/Dockerfile'
              - 'api/docker-entrypoint.sh'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            frontend-image:
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'frontend/nginx.conf'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

      # Images are built and scanned on PRs only; on push docker-publish.yml builds them.
      - id: images
        env:
          API: ${{ steps.filter.outputs.api-image }}
          FRONTEND: ${{ steps.filter.outputs.frontend-image }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          images='[]'
          if [ "$IS_PR" = true ]; then
            images="$(jq -cn --arg api "$API" --arg fe "$FRONTEND" \
              '[if $api == "true" then "api" else empty end, if $fe == "true" then "frontend" else empty end]')"
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # Fail fast: format, lint and typecheck gate the test matrix.
  python-lint:
    name: Python Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run Ruff format check
        run: make format-check

      - name: Run Ruff linting
        run: make lint

      # mypy validates cache entries against file hashes, so a restored cache is safe.
      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - name: Run mypy type checking
        run: make typecheck

  python-test:
    name: Python Tests (${{ matrix.python-version }})
    needs: [changes, python-lint]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    strategy:
      fail-fast: false
      matrix:
        # Version-specific failures have not occurred in practice: every recent Python
        # failure hit all three versions alike. The full matrix runs weekly and on demand.
        python-version: ${{ fromJSON(needs.changes.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      # 3.11 is the coverage-gated reference run; newer versions run the compat suite.
      - name: Run pytest with coverage
        if: matrix.python-version == '3.11'
        env:
          COVERAGE_CORE: sysmon
        run: make test-ci

      - name: Run pytest compatibility suite
        if: matrix.python-version != '3.11'
        run: uv run pytest tests/ -q -m "not slow and not e2e" --no-cov

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: python
          name: python-3.11
        continue-on-error: true

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.eslintcache
          key: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.*') }}
          restore-keys: |
            eslint-

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format:check

      - name: Run Vitest tests (with coverage on main, no coverage on PRs)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npm run test:ci
          else
            npm run test:coverage
          fi

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1

  # Runs only after the code it packages has passed tests; reuses the public
  # registry build cache that docker-publish.yml writes on main.
  docker-build-test:
    name: Docker Build & Scan (${{ matrix.service }})
    needs: [changes, python-test, frontend-ci]
    if: >-
      ${{ always() && needs.changes.outputs.images != '[]' && needs.changes.outputs.images != ''
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the multi-GB API image needs the extra disk.
      - name: Free disk space
        if: matrix.service == 'api'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY"
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service == 'api' && '.' || './frontend' }}
          file: ${{ matrix.service == 'api' && './api/Dockerfile' || './frontend/Dockerfile' }}
          push: false
          load: true
          tags: phentrieve-${{ matrix.service }}:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache
          build-args: |
            ${{ matrix.service == 'frontend' && 'VITE_API_URL=/api/v1' || '' }}

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: phentrieve-${{ matrix.service }}:ci
          scanners: vuln
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    permissions:
      contents: read
    steps:
      - name: Review dependency changes via API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          response_body="$(mktemp)"
          response_headers="$(mktemp)"
          findings_json="$(mktemp)"
          trap 'rm -f "$response_body" "$response_headers" "$findings_json"' EXIT

          attempt=1
          max_attempts=3
          while true; do
            curl -fsSL \
              -D "$response_headers" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" \
              -o "$response_body"

            snapshot_warning_header="$(awk 'BEGIN{IGNORECASE=1} /^x-github-dependency-graph-snapshot-warnings:/{sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$response_headers")"
            snapshot_warning="$(printf '%s' "$snapshot_warning_header" | python -c 'import base64, sys; data = sys.stdin.read().strip(); print(base64.b64decode(data).decode("utf-8") if data else "", end="")')"

            if [[ -z "${snapshot_warning}" ]] || [[ "$attempt" -ge "$max_attempts" ]]; then
              break
            fi

            echo "Dependency graph snapshot warning detected; retrying in $((2 ** attempt))s..." >&2
            sleep $((2 ** attempt))
            attempt=$((attempt + 1))
          done

          if [[ -n "${snapshot_warning:-}" ]]; then
            {
              echo "## Dependency review snapshot warning"
              echo
              echo '```'
              echo "${snapshot_warning}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Accepted, documented advisories that must not fail this gate. Keep in
          # sync with the pip-audit --ignore-vuln list in security.yml.
          # - GHSA-f4j7-r4q5-qw2c / CVE-2026-45829: chromadb >=1.0.0,<=1.5.9. ChromaDB
          #   1.x is required to read the published multi-vector data bundles (0.6.x
          #   fails with KeyError '_type'); 1.5.9 is the latest release and the
          #   advisory has no patched fix yet (see security.yml and the
          #   test_dependency_security_policy.py policy tests).
          # - GHSA-36p7-vc44-83pf, GHSA-2wm9-hf6c-p5cr, GHSA-xph7-9rjv-w5fr: chromadb
          #   server-only advisories (HTTP /api/v2 endpoints, cross-tenant authz, and the
          #   SimpleRBACAuthorizationProvider). Phentrieve uses the embedded
          #   chromadb.PersistentClient exclusively and never starts the server, so none are
          #   reachable. No patched 1.x release exists yet.
          jq --argjson allowed_advisories '["GHSA-f4j7-r4q5-qw2c", "GHSA-36p7-vc44-83pf", "GHSA-2wm9-hf6c-p5cr", "GHSA-xph7-9rjv-w5fr"]' '
            [
              .[]
              | select(.change_type != "removed")
              | select((.scope // "unknown") == "runtime")
              | . as $dependency
              | ($dependency.vulnerabilities // [])[]?
              | select((.severity // "" | ascii_downcase) == "high" or (.severity // "" | ascii_downcase) == "critical")
              | select((.advisory_ghsa_id // "") as $ghsa | ($allowed_advisories | index($ghsa)) | not)
              | {
                  manifest: $dependency.manifest,
                  ecosystem: $dependency.ecosystem,
                  name: $dependency.name,
                  version: $dependency.version,
                  scope: ($dependency.scope // "unknown"),
                  severity: (.severity // "unknown"),
                  advisory: (.advisory_ghsa_id // "unknown"),
                  summary: (.advisory_summary // "No summary provided"),
                  url: (.advisory_url // "")
                }
            ]
          ' "$response_body" > "$findings_json"

          if [[ "$(jq 'length' "$findings_json")" -eq 0 ]]; then
            {
              echo "## Dependency review"
              echo
              echo "No new runtime dependencies with high or critical vulnerabilities were detected."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Dependency review failures"
            echo
            echo "| Dependency | Version | Severity | Advisory | Manifest |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| \(.name) | \(.version) | \(.severity) | \(.advisory) | \(.manifest) |"' "$findings_json"
            echo
            echo "High or critical vulnerabilities were introduced in runtime dependency changes."
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '.[] | "\(.severity): \(.name)@\(.version) (\(.advisory)) - \(.summary)\n\(.url)\n"' "$findings_json" >&2
          exit 1

  # Single required check: path-filtered jobs report "skipped", which passes, while a
  # failed or cancelled job fails the gate.
  ci-summary:
    name: CI Summary
    needs: [changes, python-lint, python-test, frontend-ci, docker-build-test, dependency-review]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI Results Summary"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "$RESULTS")"
          if [ -n "$failed" ]; then
            echo "::error::CI jobs did not pass: $failed"
            exit 1
          fi
