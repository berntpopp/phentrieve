name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'plan/**'
      - 'LICENSE'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Prevent concurrent builds - API image takes 20+ minutes
# Cancel in-progress builds when new commits are pushed
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # Security: Lint Dockerfiles
  lint-dockerfiles:
    name: Lint Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: api/Dockerfile
          failure-threshold: error

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

  build-and-push-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: lint-dockerfiles
    timeout-minutes: 60  # ML dependencies (PyTorch, sentence-transformers) need 20-30min
    permissions:
      contents: read
      packages: write
      security-events: write  # For Trivy SARIF upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          # Remove Android SDK (~12GB), .NET (~2GB), Haskell (~6GB)
          android: true
          dotnet: true
          haskell: true
          # Remove large packages and docker images to free max space for ML image
          large-packages: true
          docker-images: true
          swap-storage: true
          # Keep tool cache for faster subsequent runs
          tool-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for API
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache is more reliable than gha for large ML images (PyTorch ~2GB)
          # See: https://docs.docker.com/build/cache/backends/registry/
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:buildcache
          # Only write cache on push (PRs skip registry login, can only read cache)
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME_API) || '' }}
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}  # Load for scanning on PRs
          # Pre-built HPO data bundle configuration (Issue #117, #133)
          # Mode 1 (default): Download BioLORD bundle from GitHub Releases
          # This embeds HPO data + vector indexes for instant cold starts
          build-args: |
            BUNDLE_URL=https://github.com/berntpopp/phentrieve-data/releases/download/hpo-v2026-09-01-r1/phentrieve-data-v2026-09-01-biolord-multivec.tar.gz
            BUILD_INDEXES=false

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: .trivyignore
          # Fail the run on a fixable HIGH/CRITICAL finding; the SARIF still uploads.
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'trivy-api'

      # Dockle - CIS benchmark compliance checker
      - name: Run Dockle on API image
        if: ${{ !cancelled() }}
        uses: erzz/dockle-action@e8a7c41f36f1236ca3282b298d425ffbfdb2e922 # v1.4.1
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ steps.meta.outputs.version }}
          report-format: sarif
          report-name: dockle-api-results
          failure-threshold: high
          exit-code: 0  # Don't fail build, just report
          # Accept known deviations from CIS benchmarks
          accept-filenames: settings.py
          # CIS-DI-0010: Do not store secrets - we use env vars at runtime

      - name: Filter accepted Dockle API findings
        if: ${{ !cancelled() }}
        run: |
          jq '(.runs[]?.results) |= map(select((.ruleId // .rule.id // "") != "DKL-DI-0005"))' \
            dockle-api-results.sarif > dockle-api-results.filtered.sarif
          mv dockle-api-results.filtered.sarif dockle-api-results.sarif
        # DKL-DI-0005 is emitted from the upstream python:slim base image apt layer.

      - name: Upload Dockle API results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: dockle-api-results.sarif
          category: 'dockle-api'

  build-and-push-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: lint-dockerfiles
    timeout-minutes: 20  # Prevent indefinite hangs (VNtyper best practice)
    permissions:
      contents: read
      packages: write
      security-events: write  # For Trivy SARIF upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        id: build-frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache for consistency with API image caching strategy
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:buildcache
          # Only write cache on push (PRs skip registry login, can only read cache)
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME_FRONTEND) || '' }}
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}  # Load for scanning on PRs
          build-args: |
            VITE_API_URL=/api/v1

      - name: Scan Frontend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: .trivyignore
          # Fail the run on a fixable HIGH/CRITICAL finding; the SARIF still uploads.
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

      # Dockle - CIS benchmark compliance checker
      - name: Run Dockle on Frontend image
        if: ${{ !cancelled() }}
        uses: erzz/dockle-action@e8a7c41f36f1236ca3282b298d425ffbfdb2e922 # v1.4.1
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.meta.outputs.version }}
          report-format: sarif
          report-name: dockle-frontend-results
          failure-threshold: high
          exit-code: 0  # Don't fail build, just report

      - name: Upload Dockle Frontend results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: dockle-frontend-results.sarif
          category: 'dockle-frontend'
