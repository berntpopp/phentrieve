name: Security Scanning

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'plan/**'
      - 'LICENSE'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'plan/**'
      - 'LICENSE'
      - '.github/workflows/deploy-docs.yml'
  schedule:
    # Weekly Monday 6 AM UTC - regular security audits
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Python dependency vulnerability scanning
  pip-audit:
    name: Python Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # The scanners need only the locked dev tools, not the multi-GB runtime stack.
      - name: Install scanner tools
        run: uv sync --locked --only-group dev

      - name: Export locked Python dependencies
        run: |
          uv export --format requirements-txt --all-extras --dev --no-emit-project --no-hashes > audit-requirements.txt

      - name: Run pip-audit
        run: |
          # Ignored vulnerabilities have no compatible patched release yet (checked 2026-07-15):
          # - GHSA-f4j7-r4q5-qw2c / CVE-2026-45829: chromadb >=1.0.0,<=1.5.9. ChromaDB 1.x is
          #   REQUIRED to read the published multi-vector data bundles (0.6.x cannot); 1.5.9 is
          #   the latest release and no patched 1.x exists yet. Accepted risk. Remove once a
          #   patched chromadb >1.5.9 ships.
          # - CVE-2026-45830, CVE-2026-45831, CVE-2026-45833: all three require the ChromaDB
          #   HTTP server (/api/v2 endpoints, multi-tenant authz, SimpleRBACAuthorizationProvider).
          #   Phentrieve only ever constructs chromadb.PersistentClient against a local directory
          #   and never runs the server or an auth provider, so none of them are reachable here.
          #   No patched 1.x release exists. Remove once a patched chromadb >1.5.9 ships.
          # The Transformers exceptions (PYSEC-2025-217, PYSEC-2026-2288/2289/2290) were
          # removed together with the JinaBert model: its pinned remote implementation imports
          # transformers.pytorch_utils.find_pruneable_heads_and_indices, which no longer exists
          # in Transformers 5.x. Dropping that model unblocked the patched 5.x major.
          uv run --no-sync pip-audit --requirement audit-requirements.txt --vulnerability-service pypi \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --no-deps --disable-pip

  # Python SAST with Bandit (run directly with uv for proper pyproject.toml support)
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # The scanners need only the locked dev tools, not the multi-GB runtime stack.
      - name: Install scanner tools
        run: uv sync --locked --only-group dev

      - name: Run Bandit Security Scan
        run: |
          uv run --no-sync bandit -r phentrieve api -c pyproject.toml -f sarif -o bandit-results.sarif --severity-level medium --confidence-level medium || true
          # Always generate output even if no issues found
          if [ ! -s bandit-results.sarif ]; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Bandit","version":"1.9.2"}},"results":[]}]}' > bandit-results.sarif
          fi

      - name: Upload Bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # JavaScript dependency vulnerability scanning
  npm-audit:
    name: JavaScript Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Run npm audit (full report)
        working-directory: frontend
        run: npm audit --audit-level=high || true
        # Don't fail on high for dev deps - many false positives

  # Security scan summary
  security-summary:
    name: Security Summary
    needs: [pip-audit, bandit, npm-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check security scan results
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit (Python deps) | ${{ needs.pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit (Python SAST) | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit (JS deps) | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if critical scans failed
          if [[ "${{ needs.pip-audit.result }}" == "failure" ]]; then
            echo "::error::pip-audit found vulnerabilities in Python dependencies"
            exit 1
          fi

          if [[ "${{ needs.bandit.result }}" == "failure" ]]; then
            echo "::error::Bandit found security issues in Python code"
            exit 1
          fi

          # npm-audit failure is warning only (many false positives)
          if [[ "${{ needs.npm-audit.result }}" == "failure" ]]; then
            echo "::warning::npm audit found issues - review recommended"
          fi

          echo "::notice::Security scans completed"
